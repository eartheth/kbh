```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | KBH</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f5fa;
    color: #333;
}


/* HERO */

.container {
    min-height: 320px;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 60px 25px;

    text-align: center;

    background:
        linear-gradient(
            rgba(25, 20, 35, 0.35),
            rgba(25, 20, 35, 0.55)
        ),
        url("bg.png");

    background-size: cover;
    background-position: center;

    color: white;
}

.container h1 {
    max-width: 1000px;

    font-size: 46px;
    line-height: 1.2;

    font-weight: normal;

    text-shadow:
        0 3px 15px rgba(0, 0, 0, 0.3);
}

.container span {
    color: #A16BD3;
    font-weight: bold;
}


/* CONTENT */

.content-section {
    padding: 0 20px 70px;
}


/* CARD */

.card {
    width: 100%;
    max-width: 650px;

    margin: -65px auto 0;

    position: relative;

    background: white;

    padding: 45px;

    border-radius: 20px;

    box-shadow:
        0 15px 45px rgba(56, 38, 72, 0.12);

    border:
        1px solid rgba(161, 107, 211, 0.12);

    text-align: center;
}


/* TITLE */

.card h2 {
    font-size: 32px;

    margin-bottom: 15px;

    font-weight: normal;
}

.card h2 span {
    color: #A16BD3;
    font-weight: bold;
}


/* DESCRIPTION */

.card > p {
    color: #777;

    font-size: 16px;
    line-height: 1.7;

    margin-bottom: 25px;
}


/* INFO BOX */

.info-box {
    background: #faf8fc;

    border:
        1px solid rgba(161, 107, 211, 0.15);

    border-radius: 12px;

    padding: 20px;

    text-align: left;

    margin-top: 25px;
}

.info-box div {
    margin-bottom: 18px;
}

.info-box div:last-child {
    margin-bottom: 0;
}

.info-box strong {
    display: block;

    color: #A16BD3;

    margin-bottom: 6px;
}

.info-value {
    color: #444;

    font-size: 15px;
    line-height: 1.6;

    overflow-wrap: anywhere;
}


/* BACK BUTTON */

.back-btn {
    display: inline-block;

    margin-top: 30px;

    padding: 13px 28px;

    text-decoration: none;

    background: #A16BD3;
    color: white;

    border-radius: 10px;

    font-weight: bold;

    transition: all 0.2s ease;

    box-shadow:
        0 7px 20px rgba(161, 107, 211, 0.25);
}

.back-btn:hover {
    background: #915BC7;

    transform: translateY(-2px);

    box-shadow:
        0 10px 25px rgba(161, 107, 211, 0.35);
}

.back-btn:active {
    transform: translateY(0);
}


/* MOBILE */

@media (max-width: 700px) {

    .container {
        min-height: 280px;
        padding: 50px 20px 80px;
    }

    .container h1 {
        font-size: 32px;
    }

    .card {
        margin-top: -55px;
        padding: 30px 22px;
    }

    .card h2 {
        font-size: 27px;
    }

}

</style>

</head>


<body>


<!-- HERO -->

<div class="container">

    <h1>
        Knightsbridge House International School
        <span>Nonthaburi</span>
    </h1>

</div>


<!-- CONTENT -->

<section class="content-section">

    <div class="card">

        <h2>
            Hi <span id="welcomeName">Guest!</span> 👋
        </h2>

        <p>
            Thank you for contacting us.<br>
            We have received your message and will get back to you soon.
        </p>


        <div class="info-box">

            <div>

                <strong>
                    Name
                </strong>

                <div
                    class="info-value"
                    id="displayName"
                >
                    -
                </div>

            </div>


            <div>

                <strong>
                    Email
                </strong>

                <div
                    class="info-value"
                    id="displayEmail"
                >
                    -
                </div>

            </div>


            <div>

                <strong>
                    Your Message
                </strong>

                <div
                    class="info-value"
                    id="displayMessage"
                >
                    -
                </div>

            </div>

        </div>


        <a
            href="index.html"
            class="back-btn"
        >
            Back to Home
        </a>

    </div>

</section>



<script>

/* ---------------------------------
   READ URL PARAMETERS
---------------------------------- */

const params =
    new URLSearchParams(window.location.search);


const name =
    params.get("name") || "";

const email =
    params.get("email") || "";

const message =
    params.get("message") || "";


/* ---------------------------------
   DISPLAY NAME
---------------------------------- */

const welcomeName =
    document.getElementById("welcomeName");

const displayName =
    document.getElementById("displayName");

const displayEmail =
    document.getElementById("displayEmail");

const displayMessage =
    document.getElementById("displayMessage");


if (name.trim() !== "") {

    welcomeName.textContent =
        name + "!";

    displayName.textContent =
        name;

} else {

    welcomeName.textContent =
        "Guest!";

    displayName.textContent =
        "Not provided";

}


/* ---------------------------------
   DISPLAY EMAIL
---------------------------------- */

if (email.trim() !== "") {

    displayEmail.textContent =
        email;

} else {

    displayEmail.textContent =
        "Not provided";

}


/* ---------------------------------
   DISPLAY MESSAGE
---------------------------------- */

if (message.trim() !== "") {

    displayMessage.textContent =
        message;

} else {

    displayMessage.textContent =
        "No message provided";

}

</script>


</body>

</html>
