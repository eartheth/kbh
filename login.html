<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Year 9 Login | KBH</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f5fa;
            color: #333;
        }


        /* HERO */

        .hero {
            min-height: 320px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 90px 25px;

            text-align: center;

            background:
                linear-gradient(rgba(25, 20, 35, 0.35),
                    rgba(25, 20, 35, 0.55)),
                url("bg.png");

            background-size: cover;
            background-position: center;

            color: white;
        }

        .hero h1 {
            max-width: 1000px;

            font-size: 46px;
            line-height: 1.2;

            font-weight: normal;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.3);
        }

        .hero span {
            color: #A16BD3;
            font-weight: bold;
        }


        /* LOGIN */

        .login-section {
            padding: 0 20px 70px;
        }

        .login-card {
            width: 100%;
            max-width: 520px;

            margin: -65px auto 0;

            position: relative;

            background: white;

            padding: 45px;

            border-radius: 20px;

            border:
                1px solid rgba(161, 107, 211, 0.14);

            box-shadow:
                0 15px 45px rgba(56, 38, 72, 0.12);
        }


        /* HEADER */

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .login-header h2 span {
            color: #A16BD3;
        }

        .login-header p {
            color: #777;
            font-size: 15px;
            line-height: 1.6;
        }


        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;

            color: #444;
        }

        .form-group input {
            width: 100%;

            padding: 14px 16px;

            border: 2px solid #eee;
            border-radius: 10px;

            background: #fafafa;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;

            outline: none;

            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: #A16BD3;

            background: white;

            box-shadow:
                0 0 0 4px rgba(161, 107, 211, 0.10);
        }


        /* PASSWORD WRAPPER */

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 80px;
        }

        .show-password {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: none;

            color: #A16BD3;

            font-weight: bold;
            font-size: 13px;

            cursor: pointer;
        }


        /* ERROR / SUCCESS */

        .message-box {
            display: none;

            margin-bottom: 20px;

            padding: 13px 15px;

            border-radius: 10px;

            font-size: 14px;

            text-align: center;
        }

        .message-box.error {
            display: block;

            background: #fff2f2;
            color: #c94d4d;

            border: 1px solid #ffdada;
        }

        .message-box.success {
            display: block;

            background: #f3ecfa;
            color: #70449b;

            border: 1px solid #dbc3f1;
        }


        /* BUTTON */

        .login-btn {
            width: 100%;

            padding: 15px 20px;

            border: none;
            border-radius: 10px;

            background: #A16BD3;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: all 0.2s ease;

            box-shadow:
                0 7px 20px rgba(161, 107, 211, 0.25);
        }

        .login-btn:hover {
            background: #915BC7;

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(161, 107, 211, 0.35);
        }

        .login-btn:active {
            transform: translateY(0);
        }


        /* BACK */

        .back-link {
            text-align: center;
            margin-top: 22px;
        }

        .back-link a {
            color: #A16BD3;

            text-decoration: none;

            font-size: 14px;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .hero {
                min-height: 280px;
                padding: 60px 20px 80px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .login-card {
                margin-top: -55px;
                padding: 30px 22px;
            }

            .login-header h2 {
                font-size: 26px;
            }
        }
    </style>

</head>


<body>


    <!-- HERO -->

    <div class="hero">

        <h1>
            Knightsbridge House International School
            <span>Nonthaburi</span>
        </h1>

    </div>


    <!-- LOGIN -->

    <section class="login-section">

        <div class="login-card">

            <div class="login-header">

                <h2>
                    Year 9 <span>Login</span>
                </h2>

                <p>
                    Enter your details to access the Year 9 portal.
                </p>

            </div>


            <div id="messageBox" class="message-box"></div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="secretCode">
                        Secret Code
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="secretCode" placeholder="Enter the secret code" required>

                    </div>

                </div>

                <button type="submit" class="login-btn">
                    Enter Portal
                </button>

            </form>


            <div class="back-link">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </section>


    <script src="login.js"></script>


</body>

</html>
