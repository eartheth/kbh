<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBH Trailer</title>

<style>
  :root {
    --open-time: 2.8s;
    --purple: #7e46b7;
    --purple-soft: #c7a6ea;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #fbf9ff;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    color: #3c1f5f;
  }

  /* soft cinematic background */
  body::before {
    content: "";
    position: fixed;
    inset: -15%;
    background:
      radial-gradient(circle at 50% 42%, rgba(126, 70, 183, .20), transparent 34%),
      radial-gradient(circle at 18% 22%, rgba(196, 162, 230, .28), transparent 24%),
      radial-gradient(circle at 82% 18%, rgba(255,255,255,.95), transparent 28%),
      linear-gradient(135deg, #ffffff 0%, #f4edfb 48%, #efe4fa 100%);
    filter: blur(16px);
    transform: scale(1.08);
    pointer-events: none;
  }

  .stage {
    position: relative;
    width: min(76vw, 1120px);
    aspect-ratio: 16 / 9;
    max-height: 76vh;
    border-radius: 28px;
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 28px 90px rgba(93,45,145,.22),
      0 0 0 1px rgba(93,45,145,.12),
      0 0 90px rgba(164,116,211,.20);
    transform: scale(.84);
    opacity: .72;
    transition:
      width var(--open-time) cubic-bezier(.16,.84,.20,1),
      height var(--open-time) cubic-bezier(.16,.84,.20,1),
      max-height var(--open-time) cubic-bezier(.16,.84,.20,1),
      border-radius var(--open-time) cubic-bezier(.16,.84,.20,1),
      transform var(--open-time) cubic-bezier(.16,.84,.20,1),
      opacity 1.2s ease,
      box-shadow var(--open-time) ease;
  }

  body.ready .stage {
    transform: scale(1);
    opacity: 1;
  }

  body.fullscreen .stage {
    width: 100vw;
    height: 100svh;
    max-height: 100svh;
    aspect-ratio: auto;
    border-radius: 0;
    transform: scale(1);
    box-shadow: none;
  }

  #trailer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #fff;
    opacity: 0;
    transform: scale(1.025);
    transition: opacity 1s ease, transform 4s ease;
  }

  body.video-visible #trailer {
    opacity: 1;
    transform: scale(1);
  }

  .poster-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(126,70,183,.24), transparent 28%),
      radial-gradient(circle at 72% 28%, rgba(201,174,230,.40), transparent 30%),
      linear-gradient(135deg, #ffffff 0%, #f4edfb 48%, #e8d9f7 100%);
    transition: opacity 1.2s ease;
  }

  body.video-visible .poster-glow {
    opacity: 0;
    pointer-events: none;
  }

  /* loading UI */
  .waiting {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    z-index: 5;
    background:
      linear-gradient(rgba(255,255,255,.72), rgba(245,238,251,.88)),
      repeating-linear-gradient(
        0deg,
        rgba(93,45,145,.025) 0,
        rgba(93,45,145,.025) 1px,
        transparent 1px,
        transparent 5px
      );
    transition: opacity .8s ease, visibility .8s ease;
  }

  body.ready .waiting {
    opacity: 0;
    visibility: hidden;
  }

  .wait-box {
    width: min(420px, calc(100vw - 48px));
    text-align: center;
    padding: 34px;
  }

  .orb {
    position: relative;
    width: 92px;
    height: 92px;
    margin: 0 auto 28px;
  }

  .orb::before,
  .orb::after,
  .orb span {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(93,45,145,.18);
  }

  .orb::before {
    border-top-color: rgba(93,45,145,.95);
    animation: spin 2.3s linear infinite;
  }

  .orb::after {
    inset: 11px;
    border-right-color: var(--purple-soft);
    animation: spinReverse 1.7s linear infinite;
  }

  .orb span {
    inset: 25px;
    background: radial-gradient(circle, rgba(126,70,183,.95) 0%, rgba(184,143,220,.35) 45%, transparent 72%);
    border: 0;
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes spinReverse {
    to { transform: rotate(-360deg); }
  }

  @keyframes pulse {
    50% { transform: scale(.72); opacity: .45; }
  }

  .wait-title {
    font-size: 12px;
    letter-spacing: .27em;
    font-weight: 800;
    color: #4a246f;
    text-transform: uppercase;
  }

  .wait-sub {
    margin-top: 11px;
    color: rgba(74,36,111,.62);
    font-size: 13px;
  }

  .progress {
    width: 100%;
    height: 2px;
    background: rgba(93,45,145,.12);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 23px;
  }

  .progress-fill {
    width: 3%;
    height: 100%;
    background: linear-gradient(90deg, #5d2d91, #a66bd6, #ffffff);
    box-shadow: 0 0 16px rgba(199,166,234,.8);
    transition: width .4s ease;
  }

  .progress-label {
    margin-top: 8px;
    font-size: 11px;
    color: rgba(74,36,111,.50);
    font-variant-numeric: tabular-nums;
  }

  /* "ready" message shown during fullscreen expansion */
  .ready-message {
    position: fixed;
    z-index: 8;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.96);
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity .7s ease, transform .7s ease;
    pointer-events: none;
  }

  body.ready:not(.playing) .ready-message {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
  }

  .ready-message .eyebrow {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: #7a43ac;
  }

  .ready-message h1 {
    margin: 12px 0 0;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(38px, 7vw, 88px);
    letter-spacing: -.04em;
  }

  body.playing .ready-message {
    opacity: 0;
    visibility: hidden;
  }

  /* Autoplay fallback */
  .play-gate {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    place-items: center;
    background: rgba(246,240,252,.74);
    backdrop-filter: blur(8px);
  }

  .play-gate.show {
    display: grid;
  }

  .play-button {
    border: 1px solid rgba(255,255,255,.28);
    background: rgba(255,255,255,.11);
    color: #3c1f5f;
    border-radius: 999px;
    min-width: 190px;
    min-height: 58px;
    padding: 0 28px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .07em;
    cursor: pointer;
    backdrop-filter: blur(12px);
    box-shadow: 0 18px 55px rgba(93,45,145,.18);
    transition: transform .2s ease, background .2s ease;
  }

  .play-button:hover {
    transform: scale(1.04);
    background: #f4ebfb;
  }

  .sound-hint {
    position: fixed;
    z-index: 15;
    right: 18px;
    bottom: 18px;
    display: none;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.52);
    color: #3c1f5f;
    border-radius: 999px;
    padding: 10px 15px;
    font-size: 12px;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }

  .sound-hint.show {
    display: block;
  }

  .back {
    position: fixed;
    z-index: 30;
    left: 18px;
    top: 98px;
    color: #5d2d91;
    background: rgba(255,255,255,.88);
    border: 1px solid rgba(93,45,145,.16);
    border-radius: 999px;
    padding: 9px 14px;
    font-size: 12px;
    backdrop-filter: blur(9px);
    opacity: 0;
    transition: opacity .5s ease;
  }

  body.playing .back {
    opacity: 1;
  }


  /* White + purple cinematic transition */
  .transition-wash {
    position: fixed;
    inset: 0;
    z-index: 7;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
  }

  .wash-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 14vmin;
    height: 14vmin;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(.2);
    background:
      radial-gradient(circle,
        rgba(255,255,255,1) 0 30%,
        rgba(225,206,244,.96) 31% 48%,
        rgba(126,70,183,.90) 49% 60%,
        rgba(255,255,255,0) 61%);
    filter: blur(.3px);
    box-shadow:
      0 0 50px rgba(126,70,183,.30),
      0 0 130px rgba(176,130,218,.28);
  }

  body.ready .transition-wash {
    opacity: 1;
    animation: washFade 3.2s ease forwards;
  }

  body.ready .wash-ring {
    animation: ringOpen 3.0s cubic-bezier(.16,.84,.20,1) forwards;
  }

  @keyframes ringOpen {
    0% {
      transform: translate(-50%, -50%) scale(.15);
      opacity: 0;
    }
    12% {
      opacity: 1;
    }
    78% {
      transform: translate(-50%, -50%) scale(13);
      opacity: .95;
    }
    100% {
      transform: translate(-50%, -50%) scale(20);
      opacity: 0;
    }
  }

  @keyframes washFade {
    0%, 74% { opacity: 1; }
    100% { opacity: 0; }
  }


  .ready-message {
    color: #3b1d5d;
    text-shadow: 0 8px 34px rgba(93,45,145,.18);
  }

  .ready-message::before {
    content: "";
    position: absolute;
    inset: -34px -46px;
    z-index: -1;
    border-radius: 32px;
    background: rgba(255,255,255,.70);
    border: 1px solid rgba(93,45,145,.10);
    box-shadow: 0 22px 70px rgba(93,45,145,.16);
    backdrop-filter: blur(16px);
  }


  /* KBH header */
  .site-header {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 60;
    background: rgba(255,255,255,.88);
    border-bottom: 1px solid rgba(93,45,145,.10);
    box-shadow: 0 10px 35px rgba(93,45,145,.10);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .nav {
    width: min(1180px, calc(100% - 48px));
    min-height: 82px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
  }

  .brand {
    width: min(330px, 43vw);
    display: block;
    flex: 0 1 auto;
  }

  .brand img {
    width: 100%;
    height: auto;
    display: block;
    filter: brightness(0) saturate(100%) invert(23%) sepia(31%) saturate(2768%) hue-rotate(247deg) brightness(84%) contrast(94%);
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 26px;
    font-size: 14px;
    font-weight: 700;
    color: #4a246f;
  }

  .nav-links a {
    color: inherit;
    text-decoration: none;
    transition: color .2s ease, transform .2s ease;
  }

  .nav-links a:hover {
    color: #7f45b0;
    transform: translateY(-1px);
  }

  .contact-btn {
    border: 1px solid rgba(93,45,145,.30);
    border-radius: 999px;
    padding: 10px 18px;
    background: rgba(255,255,255,.72);
  }

  .contact-btn:hover {
    background: #5d2d91;
    color: #fff !important;
    border-color: #5d2d91;
  }

  .menu-toggle {
    display: none;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(93,45,145,.18);
    border-radius: 50%;
    background: rgba(255,255,255,.82);
    color: #5d2d91;
    font-size: 20px;
    cursor: pointer;
  }

  @media (max-width: 900px) {
    .nav {
      min-height: 74px;
      width: min(100% - 28px, 1180px);
    }

    .brand {
      width: min(250px, 62vw);
    }

    .menu-toggle {
      display: grid;
      place-items: center;
    }

    .nav-links {
      position: fixed;
      left: 14px;
      right: 14px;
      top: 82px;
      display: grid;
      gap: 6px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 18px 55px rgba(93,45,145,.16);
      border: 1px solid rgba(93,45,145,.10);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: .22s ease;
    }

    .site-header.menu-open .nav-links {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .nav-links a {
      padding: 10px 8px;
      border-radius: 10px;
    }

    .contact-btn {
      text-align: center;
      background: #5d2d91;
      color: #fff !important;
    }
  }

  @media (max-width: 700px) {
    .stage {
      width: 88vw;
      border-radius: 18px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage,
    #trailer,
    .ready-message {
      transition-duration: .01ms !important;
    }
  }
</style>
</head>

<body>


<header class="site-header" id="header">
  <div class="nav">
    <a class="brand" href="index.html" aria-label="Knightsbridge House home">
      <img
        src="https://images.squarespace-cdn.com/content/v1/6715841c733ae404b8220f77/03e46c28-6601-45a0-a324-7e7121390e73/KBH_Nonthaburi_Social_FB_Template_Official%2BLogo%2BWhite.png"
        alt="Knightsbridge House International School Nonthaburi"
      />
    </a>

    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">☰</button>

    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#offers">Our School</a>
      <a href="teachers.html?subject=all">Our Teacher</a>
      <a class="contact-btn" href="index.html#contact">Contact Us</a>
    </nav>
  </div>
</header>

<a class="back" href="index.html">← Back</a>

<div class="transition-wash" aria-hidden="true">
  <div class="wash-ring"></div>
</div>

<div class="stage" id="stage">
  <div class="poster-glow"></div>

  <video id="trailer" preload="auto" playsinline>
    <source src="kbh-video.mp4" type="video/mp4">
  </video>

  <div class="waiting" id="waiting">
    <div class="wait-box">
      <div class="orb"><span></span></div>
      <div class="wait-title">Preparing trailer</div>
      <div class="wait-sub" id="waitText">Loading enough video to begin…</div>

      <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label" id="progressLabel">BUFFERING</div>
    </div>
  </div>
</div>

<div class="ready-message">
  <div class="eyebrow">Knightsbridge House</div>
  <h1>Ready.</h1>
</div>

<div class="play-gate" id="playGate">
  <button class="play-button" id="playButton">PLAY TRAILER</button>
</div>

<button class="sound-hint" id="soundHint">🔇 Click for sound</button>

<script>
const header = document.getElementById("header");
const menuToggle = document.getElementById("menuToggle");

menuToggle.addEventListener("click", () => {
  const open = header.classList.toggle("menu-open");
  menuToggle.setAttribute("aria-expanded", String(open));
  menuToggle.textContent = open ? "✕" : "☰";
});
</script>

<script>
(() => {
  const video = document.getElementById("trailer");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");
  const waitText = document.getElementById("waitText");
  const playGate = document.getElementById("playGate");
  const playButton = document.getElementById("playButton");
  const soundHint = document.getElementById("soundHint");

  let openingStarted = false;
  let playbackStarted = false;

  /*
    The page does NOT wait for the whole 250 MB file.
    As soon as the browser has enough buffered video to play smoothly,
    we begin the cinematic fullscreen animation.

    While the trailer is playing, the browser keeps downloading/buffering
    the rest of the MP4 in the background.
  */

  function getBufferedPercent() {
    if (!Number.isFinite(video.duration) || video.duration <= 0 || video.buffered.length === 0) {
      return 0;
    }

    let furthest = 0;

    for (let i = 0; i < video.buffered.length; i++) {
      furthest = Math.max(furthest, video.buffered.end(i));
    }

    return Math.min(100, Math.round((furthest / video.duration) * 100));
  }

  function updateProgress() {
    const percent = getBufferedPercent();

    if (percent > 0) {
      progressFill.style.width = Math.max(3, percent) + "%";
      progressLabel.textContent = percent + "% BUFFERED";
      waitText.textContent = "Buffering trailer…";
    } else {
      progressFill.style.width = "3%";
      progressLabel.textContent = "BUFFERING";
    }
  }

  function beginOpening() {
    if (openingStarted) return;
    openingStarted = true;

    updateProgress();

    // Reveal the video frame, then slowly expand it to fill the screen.
    document.body.classList.add("video-visible");

    requestAnimationFrame(() => {
      document.body.classList.add("ready");

      setTimeout(() => {
        document.body.classList.add("fullscreen");

        // Wait for the fullscreen expansion (~2.8 s),
        // then hold for another ~3 seconds before starting playback.
        setTimeout(() => {
          startPlayback();
        }, 2800 + 3000);
      }, 180);
    });
  }

  async function startPlayback() {
    if (playbackStarted) return;

    playbackStarted = true;
    video.controls = true;

    // First try autoplay WITH sound.
    video.muted = false;

    try {
      await video.play();
      document.body.classList.add("playing");
      return;
    } catch (error) {
      // Most browsers block unmuted autoplay.
    }

    // Fallback: autoplay muted, which browsers generally allow.
    try {
      video.muted = true;
      await video.play();
      document.body.classList.add("playing");
      soundHint.classList.add("show");
      return;
    } catch (error) {
      // If even muted autoplay is blocked, ask for one click.
    }

    playbackStarted = false;
    playGate.classList.add("show");
  }

  async function userStart() {
    playGate.classList.remove("show");

    try {
      video.muted = false;
      await video.play();
      playbackStarted = true;
      document.body.classList.add("playing");

      // A true browser Fullscreen API request can only happen
      // from a real user gesture, so this is the best moment to try it.
      if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    } catch (error) {
      playGate.classList.add("show");
    }
  }

  playButton.addEventListener("click", userStart);

  soundHint.addEventListener("click", async () => {
    try {
      video.muted = false;
      soundHint.classList.remove("show");

      if (video.paused) {
        await video.play();
      }

      // Because this click is a user gesture, true fullscreen is allowed here.
      if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    } catch (error) {
      soundHint.classList.add("show");
    }
  });

  // If there is already enough cached/buffered data when the page opens,
  // start immediately.
  if (video.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
    beginOpening();
  }

  // Otherwise show the waiting animation until enough video is available.
  video.addEventListener("canplay", beginOpening, { once: true });

  video.addEventListener("loadedmetadata", updateProgress);
  video.addEventListener("progress", updateProgress);
  video.addEventListener("durationchange", updateProgress);

  // Keep the buffering UI alive while waiting.
  const progressTimer = setInterval(() => {
    updateProgress();

    if (openingStarted) {
      clearInterval(progressTimer);
    }
  }, 400);

  video.addEventListener("waiting", () => {
    // If playback catches up to the downloaded data, the browser
    // will automatically resume once more data arrives.
    if (document.body.classList.contains("playing")) {
      progressLabel.textContent = "BUFFERING…";
    }
  });

  video.addEventListener("playing", () => {
    progressLabel.textContent = "PLAYING";
  });

  video.addEventListener("error", () => {
    waitText.textContent = "The trailer could not be loaded.";
    progressLabel.textContent = "VIDEO ERROR";
  });

  // Explicitly ask the browser to begin fetching immediately.
  video.load();
})();
</script>

</body>
</html>
