<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secret! | KBH</title>

    <style>
        body {
            background-color: #eaddff;
        }

        .top {
            padding: 20px;
            margin: 5px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f7f5fa;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;

            background: linear-gradient(135deg, #ae78ff, #7c4dff);
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            box-shadow: 0 4px 12px rgba(124, 77, 255, 0.35);

            transition: all 0.2s ease;
        }

        .top button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(124, 77, 255, 0.45);
        }

        .top button:active {
            transform: translateY(0) scale(0.97);
        }

        .top p {
            margin-left: 20px;
            font-size: 18px;
        }


        h1.main {
            font-size: 36px;
            font-weight: bold;
            color: #d5baff;
            text-align: center;
            padding: 20px;
        }

        .middle {
            margin-top: 60px;
            text-align: center;
            background-color: #f7f5fa;
            padding: 60px;
            border-radius: 20px;
            font-family: Arial, Helvetica, sans-serif;
            border: 5px solid #d5baff;
        }

        .spoiler {
            color: black;
            background: black;
            padding: 5px 20px;
            border-radius: 5px;
            margin-top: 10px;
            display: inline-block;
            user-select: none;
            -webkit-user-select: none;
        }

        .spoiler::selection {
            background: #111;
            color: #111;
        }

        .middle p {
            font-size: 13px;
            color: gray;
            margin-top: 0px;
        }
    </style>

</head>

<body>
    <div class="top">
        <p>This is a <b>"very"</b> Hidden page</p>
        <button onclick="window.history.back()">GO BACK</button>
    </div>
    <div class="middle">
        <h1>This is a hidden cool page in the website</h1>
        <h3 class="spoiler">I made this by typing myself</h3>
        <p>Can you find out what is the text in the box above?</p>
    </div>
</body>
